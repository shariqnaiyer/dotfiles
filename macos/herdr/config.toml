# herdr config for macOS -> ~/.config/herdr/config.toml
# After editing:  herdr config check && herdr server reload-config

onboarding = false

[terminal]
default_shell = "/bin/zsh"

[update]
channel = "preview"
version_check = true

[ui]
agent_panel_scope = "current"
agent_panel_sort = "spaces"
mouse_capture = true
show_agent_labels_on_pane_borders = false
confirm_close = false
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false

[experimental]
pane_history = false

# tmux-style keybindings. macos/tmux/tmux.conf mirrors these.
[keys]
prefix = "ctrl+s"

detach = "prefix+d"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
close_pane = "prefix+x"
zoom = "prefix+z"
rename_pane = "prefix+shift+p"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Workspaces, no prefix. Plain alt needs Ghostty's macos-option-as-alt
# (macos/ghostty/config); ctrl+alt works in any terminal.
previous_workspace = ["alt+up", "ctrl+alt+up"]
next_workspace = ["alt+down", "ctrl+alt+down"]
switch_workspace = ["alt+1..9", "ctrl+alt+1..9"]

# threadr (github.com/shariqnaiyer/threadr)
[[keys.command]]
key = "prefix+f"
type = "pane"
command = "threadr"
description = "threadr: find and resume a session"

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "threadr tree --html"
description = "threadr: fork map"
