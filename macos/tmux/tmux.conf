# tmux for macOS -> ~/.tmux.conf
# Keys mirror macos/herdr/config.toml, so herdr and tmux feel the same:
# a herdr tab is a tmux window, a herdr workspace is a tmux session.
# The look is the same as the Linux ~/.tmux.conf.

# --- prefix -------------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# --- behaviour ----------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# --- tabs (windows) -----------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind & kill-window
bind n next-window
bind p previous-window
# prefix 1-9 select windows by default.

# --- panes --------------------------------------------------------------------
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z
bind Tab select-pane -t :.+
bind BTab select-pane -t :.-
bind P command-prompt -p "pane title:" "select-pane -T '%%'"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- workspaces (sessions), no prefix -----------------------------------------
# Plain alt needs Ghostty's macos-option-as-alt (macos/ghostty/config).
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n
bind -n C-M-Up   switch-client -p
bind -n C-M-Down switch-client -n
# alt+N jumps to the Nth session, like herdr's alt+N workspace switch.
bind -n M-1 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 1p)" 2>/dev/null || true'
bind -n M-2 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 2p)" 2>/dev/null || true'
bind -n M-3 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 3p)" 2>/dev/null || true'
bind -n M-4 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 4p)" 2>/dev/null || true'
bind -n M-5 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 5p)" 2>/dev/null || true'
bind -n M-6 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 6p)" 2>/dev/null || true'
bind -n M-7 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 7p)" 2>/dev/null || true'
bind -n M-8 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 8p)" 2>/dev/null || true'
bind -n M-9 run-shell 'tmux switch-client -t "$(tmux ls -F "##{session_name}" | sed -n 9p)" 2>/dev/null || true'

# --- threadr (github.com/shariqnaiyer/threadr) ---------------------------------
bind f new-window -n threadr threadr
bind T run-shell -b "threadr tree --html >/dev/null"

# --- look ---------------------------------------------------------------------
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=red bold'
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'
set -g status-left ''
set -g status-left-length 10
set -g status-right-style 'fg=black bg=yellow'
set -g status-right ' #S  %Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '
setw -g window-status-bell-style 'fg=yellow bg=red bold'
set -g message-style 'fg=yellow bg=red bold'
