# Unbind the default prefix key Ctrl+b
# This removes the default key binding that activates tmux commands
unbind C-b

# Set new prefix to Ctrl+a
# This changes the activation key to Ctrl+a which is easier to reach than Ctrl+b
set -g prefix C-a

# Send Ctrl+a to applications by pressing it twice
# This allows you to send the actual Ctrl+a keystroke to applications when needed
bind C-a send-prefix

# Pane navigation using vim-style movement keys
# These bindings let you navigate between panes using h,j,k,l (left, down, up, right)
# The -r flag means you can repeat the command without pressing the prefix again
bind -r h select-pane -L  # Move to the pane on the left
bind -r j select-pane -D  # Move to the pane below
bind -r k select-pane -U  # Move to the pane above
bind -r l select-pane -R  # Move to the pane on the right

# DESIGN TWEAKS
# These settings customize the visual appearance of tmux

# don't do anything when a 'bell' rings
# This disables various visual notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode color
# This sets the color of the clock displayed with prefix + t
setw -g clock-mode-colour yellow

# copy mode styling
# This sets the colors used when in copy mode (prefix + [)
setw -g mode-style 'fg=black bg=red bold'

# pane border styling
# These settings control the appearance of pane borders
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar configuration
# These settings control the appearance and content of the status bar
set -g status-position bottom      # Position the status bar at the bottom
set -g status-justify left         # Left-align window list
set -g status-style 'fg=red'       # Set status bar text color
set -g status-left ''              # No content on the left side
set -g status-left-length 10       # Maximum length for left side content
set -g status-right-style 'fg=black bg=yellow'  # Style for right side content
set -g status-right '%Y-%m-%d %H:%M '          # Show date and time on right side
set -g status-right-length 50      # Maximum length for right side content

# Window status styling
# These control the appearance of window tabs in the status bar
setw -g window-status-current-style 'fg=black bg=red'  # Current window style
setw -g window-status-current-format ' #I #W #F '      # Current window format (#I=index, #W=name, #F=flags)
setw -g window-status-style 'fg=red bg=black'          # Inactive window style
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '  # Inactive window format
setw -g window-status-bell-style 'fg=yellow bg=red bold'  # Style for windows with bell/activity

# Message styling
# This controls the appearance of command feedback messages
set -g message-style 'fg=yellow bg=red bold'


# Turn mouse on for easy switching and alignment
set -g mouse on

